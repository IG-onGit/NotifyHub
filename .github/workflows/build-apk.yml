name: Build APK

on:
  push:
    branches: [main]

# Needed so the job can commit the APK back to the repo.
permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    # Only run when the pushed head commit message contains "[deploy]".
    # The bot's own "Update [...]" commit doesn't contain it, so no loop.
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has no Gradle wrapper jar, so install Gradle 8.7 directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Commit APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NotifyHub.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f NotifyHub.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update [$(date -u +'%Y-%m-%d %H-%M')]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
